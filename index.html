<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COUNTER-ITZ 1.0 - By JuninN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">CI</span>
      <div class="logo-text">
        <span class="logo-title">COUNTER-ITZ 1.0</span>
        <span class="logo-subtitle">By JuninN</span>
      </div>
    </div>
    <div class="who">
      <span>Jogando como <strong id="current-nick">—</strong></span>
      <button id="change-nick" class="btn-ghost" type="button">Trocar</button>
    </div>
    <a href="historico.html" class="btn-ghost">Histórico</a>
  </header>

  <main class="container">
    <h1 class="page-title">Mixes da Semana</h1>
    <p class="page-subtitle">Seleciona um dia, escolhe online ou presencial, e reserva teu slot!</p>

    <div id="mixes-grid" class="mixes-grid"></div>
  </main>

  <!-- Modal de nick (primeira visita) -->
  <dialog id="modal-nick">
    <div class="modal modal-nick">
      <div class="logo-big">CI</div>
      <h2>Bem-vindo ao COUNTER-ITZ</h2>
      <p>Digita teu nick pra entrar nos mixes:</p>
      <form id="form-nick">
        <div class="form-row">
          <input id="input-nick" type="text" maxlength="24" placeholder="Teu nick" required autocomplete="off" />
        </div>
        <div class="actions">
          <button type="submit" class="btn-confirm" id="btn-save-nick">Entrar</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Modal de escolher tipo (online/presencial) -->
  <dialog id="modal-type">
    <div class="modal">
      <h2>Tipo do Mix</h2>
      <p>Escolhe se é online ou presencial pro dia <span id="modal-type-day"></span>:</p>
      <form id="form-type">
        <div class="form-row">
          <div class="radio-group">
            <label><input type="radio" name="mix-type" value="online" checked /><span>🌐 Online</span></label>
            <label><input type="radio" name="mix-type" value="presencial" /><span>📍 Presencial</span></label>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn-cancel" data-close>Cancelar</button>
          <button type="submit" class="btn-confirm">Confirmar</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Toast area -->
  <div id="toast-area"></div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/identity.js"></script>
  <script type="module" src="js/day-rollover.js"></script>
  <script type="module" src="js/ui-home.js"></script>
</body>
</html>
